workflows:
  ios-testflight-workflow:
    name: Gezegeni Koru - iOS TestFlight Auto-Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple AppStore
    environment:
      ios_signing:
        provisioning_profiles:
          - neonvoid-appstore-profile
        certificates:
          - neonvoid-dist-cert
      vars:
        BUNDLE_ID: "com.neonvoid.cyberdefense"
        APP_DISPLAY_NAME: "Gezegeni Koru"
      node: 20.11.0
      xcode: latest
    scripts:
      - name: Install NPM & Capacitor Dependencies
        script: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Configure iOS Portrait & Display Name (Gezegeni Koru)
        script: |
          PLIST="ios/App/App/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Gezegeni Koru'" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Gezegeni Koru'" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Gezegeni Koru'" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 'Verileriniz size uygun ödüllü reklamlar sunmak için kullanılır.'" "$PLIST" || true
          fi
      - name: Set Up Code Signing Settings on Xcode Project
        script: |
          xcode-project use-profiles
      - name: Increment Build Number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA for App Store & TestFlight
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
