# Gezegen oyununu mevcut Codemagic projenizle TestFlight'a yuklemek icin.
# Daha once calisan sertifika baglantisi ve workflow kimligi korunmustur.
workflows:
  ios-testflight-release:
    name: Gezegeni Koru iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Apple AppStore"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.neonvoid.cyberdefense
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies and build offline CSS
        script: |
          set -e
          npm install --no-audit --no-fund
          npm run build
          test -s www/index.html
          test -s www/tailwind.css
      - name: Generate iOS project and install CocoaPods
        script: |
          set -e
          npx cap add ios
          npx cap sync ios
          cd ios/App
          pod install
      - name: Set display name, version and encryption declaration
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Gezegeni Koru'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Gezegeni Koru'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          cd ios/App
          BUILD_NO="${PROJECT_BUILD_NUMBER:-5}"
          if [ "$BUILD_NO" -lt 5 ]; then BUILD_NO=5; fi
          agvtool new-version -all "$BUILD_NO"
      - name: Apply the existing signing profile
        script: |
          set -e
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
